services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    ports:
      - "6969:${PORT:-5001}"
    volumes:
      - ./data:/data
      - /mnt/ssd1/hotData/MangaTst:/mnt/manga:rw
      - /mnt/ssd1/hotData/MangaHidden:/mnt/hidden:rw
      - /mnt/ssd1/hotData/MangaVlad:/mnt/vlad:rw
    restart: unless-stopped

